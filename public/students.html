
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Management Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f3ff;
      color: #333;
    }

    header {
      background: #7048e8;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    header h2 {
      margin: 0;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #7048e8;
      color: white;
    }

    .logout {
      background: white;
      color: #7048e8;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px #00000010;
    }

    h3 {
      color: #7048e8;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      margin-top: 7px;
    }

    label {
      font-weight: bold;
    }

    .form-buttons {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .cancel {
      background: #777;
    }

    .search {
      margin-bottom: 20px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f0eaff;
      color: #7048e8;
    }

    .edit {
      background: #2196f3;
      margin-right: 5px;
    }

    .delete {
      background: #e53935;
    }

    #message {
      margin-top: 15px;
      color: #7048e8;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<header>
  <h2>Student Management System</h2>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <div class="card">
    <h3 id="formTitle">Add Student</h3>

    <form id="studentForm">

      <div class="form-grid">

        <div>
          <label>Name</label>
          <input id="name" required maxlength="100">
        </div>

        <div>
          <label>Roll Number</label>
          <input id="roll_number" required maxlength="30">
        </div>

        <div>
          <label>Email</label>
          <input id="email" type="email" required maxlength="150">
        </div>

        <div>
          <label>Phone</label>
          <input id="phone" maxlength="20">
        </div>

        <div>
          <label>Department</label>
          <input id="department">
        </div>

        <div>
          <label>Year</label>
          <select id="year">
            <option value="">Select Year</option>
            <option>1st Year</option>
            <option>2nd Year</option>
            <option>3rd Year</option>
            <option>4th Year</option>
          </select>
        </div>

        <div>
          <label>Gender</label>
          <select id="gender">
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>

        <div>
          <label>Section</label>
          <input id="section">
        </div>

      </div>

      <div class="form-buttons">
        <button type="submit" id="saveButton">Add Student</button>
        <button type="button" class="cancel" onclick="resetForm()">Cancel</button>
      </div>

    </form>

    <p id="message"></p>
  </div>

  <div class="card">

    <h3>Student Details</h3>

    <input
      class="search"
      id="search"
      placeholder="Search students by name, roll number or email"
    >

    <div class="table-wrapper">

      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Roll Number</th>
            <th>Email</th>
            <th>Department</th>
            <th>Year</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="studentTable"></tbody>
      </table>

    </div>

  </div>

</div>

<script>

  const form = document.getElementById("studentForm");
  const table = document.getElementById("studentTable");
  const message = document.getElementById("message");

  let students = [];
  let editingId = null;

  // Load students
  async function loadStudents() {
    try {
      const response = await fetch("/api/students");

      if (response.status === 401) {
        window.location.href = "/login.html";
        return;
      }

      students = await response.json();

      displayStudents();

    } catch (error) {
      message.textContent = "Could not load students.";
    }
  }

  // Display students
  function displayStudents() {
    const search = document.getElementById("search").value.toLowerCase();

    const filtered = students.filter(student =>
      String(student.name || "").toLowerCase().includes(search) ||
      String(student.roll_number || "").toLowerCase().includes(search) ||
      String(student.email || "").toLowerCase().includes(search)
    );

    table.innerHTML = "";

    filtered.forEach(student => {
      const row = document.createElement("tr");

      [
        student.name,
        student.roll_number,
        student.email,
        student.department,
        student.year
      ].forEach(value => {
        const cell = document.createElement("td");
        cell.textContent = value || "";
        row.appendChild(cell);
      });

      const actions = document.createElement("td");

      const editButton = document.createElement("button");
      editButton.textContent = "Edit";
      editButton.className = "edit";
      editButton.addEventListener("click", () => editStudent(student.id));

      const deleteButton = document.createElement("button");
      deleteButton.textContent = "Delete";
      deleteButton.className = "delete";
      deleteButton.addEventListener("click", () => deleteStudent(student.id));

      actions.appendChild(editButton);
      actions.appendChild(deleteButton);

      row.appendChild(actions);

      table.appendChild(row);
    });
  }

  // Add or update student
  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const student = {
      name: document.getElementById("name").value.trim(),
      roll_number: document.getElementById("roll_number").value.trim(),
      email: document.getElementById("email").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      department: document.getElementById("department").value.trim(),
      year: document.getElementById("year").value,
      gender: document.getElementById("gender").value,
      section: document.getElementById("section").value.trim()
    };

    const url = editingId
      ? `/api/students/${editingId}`
      : "/api/students";

    const method = editingId ? "PUT" : "POST";

    try {
      const response = await fetch(url, {
        method,
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(student)
      });

      const result = await response.json();

      if (response.status === 401) {
        window.location.href = "/login.html";
        return;
      }

      if (!response.ok) {
        message.textContent = result.message || "Operation failed.";
        return;
      }

      message.textContent = result.message;

      resetForm();
      await loadStudents();

    } catch (error) {
      message.textContent = "Cannot connect to server.";
    }
  });

  // Edit student
  function editStudent(id) {
    const student = students.find(s => s.id === id);

    if (!student) return;

    editingId = id;

    document.getElementById("name").value = student.name || "";
    document.getElementById("roll_number").value = student.roll_number || "";
    document.getElementById("email").value = student.email || "";
    document.getElementById("phone").value = student.phone || "";
    document.getElementById("department").value = student.department || "";
    document.getElementById("year").value = student.year || "";
    document.getElementById("gender").value = student.gender || "";
    document.getElementById("section").value = student.section || "";

    document.getElementById("formTitle").textContent = "Edit Student";
    document.getElementById("saveButton").textContent = "Update Student";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  // Delete student
  async function deleteStudent(id) {
    if (!confirm("Are you sure you want to delete this student?")) {
      return;
    }

    try {
      const response = await fetch(`/api/students/${id}`, {
        method: "DELETE"
      });

      const result = await response.json();

      if (response.status === 401) {
        window.location.href = "/login.html";
        return;
      }

      if (!response.ok) {
        alert(result.message || "Delete failed.");
        return;
      }

      await loadStudents();

    } catch (error) {
      alert("Cannot connect to server.");
    }
  }

  // Reset form
  function resetForm() {
    form.reset();
    editingId = null;

    document.getElementById("formTitle").textContent = "Add Student";
    document.getElementById("saveButton").textContent = "Add Student";

    message.textContent = "";
  }

  // Search
  document.getElementById("search").addEventListener("input", displayStudents);

  // Logout
  async function logout() {
    await fetch("/api/logout", {
      method: "POST"
    });

    window.location.href = "/login.html";
  }

  // Load page
  loadStudents();

</script>

</body>
</html>
