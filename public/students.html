
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f5fb;
            color: #222;
        }

        header {
            background: #7048e8;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 24px;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout {
            background: white;
            color: #7048e8;
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            font-size: 14px;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
        }

        input:focus,
        select:focus {
            outline: 2px solid #d8ccff;
            border-color: #7048e8;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .save {
            background: #7048e8;
            color: white;
        }

        .cancel {
            background: #e8e8e8;
            color: #333;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .search {
            margin-bottom: 15px;
            max-width: 400px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            background: #f7f5ff;
            color: #7048e8;
        }

        .edit {
            background: #e9e2ff;
            color: #5b35cf;
            margin-right: 5px;
        }

        .delete {
            background: #ffe4e4;
            color: #c62828;
        }

        .empty {
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 800px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Student Management System</h1>

    <button class="logout" id="logoutButton">
        Logout
    </button>
</header>

<div class="container">

    <div class="card">

        <h2 id="formTitle">Add Student</h2>

        <form id="studentForm">

            <input type="hidden" id="studentId">

            <div class="form-grid">

                <div class="field">
                    <label for="name">Student Name *</label>
                    <input
                        type="text"
                        id="name"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="field">
                    <label for="roll_number">Roll Number *</label>
                    <input
                        type="text"
                        id="roll_number"
                        maxlength="30"
                        required
                    >
                </div>

                <div class="field">
                    <label for="email">Email *</label>
                    <input
                        type="email"
                        id="email"
                        maxlength="150"
                        required
                    >
                </div>

                <div class="field">
                    <label for="phone">Phone</label>
                    <input
                        type="tel"
                        id="phone"
                        maxlength="20"
                    >
                </div>

                <div class="field">
                    <label for="department">Department</label>

                    <select id="department">
                        <option value="">Select Department</option>
                        <option value="CSE">CSE</option>
                        <option value="ECE">ECE</option>
                        <option value="EEE">EEE</option>
                        <option value="IT">IT</option>
                        <option value="Mechanical">Mechanical</option>
                        <option value="Civil">Civil</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="year">Year</label>

                    <select id="year">
                        <option value="">Select Year</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                </div>

                <div class="field">
                    <label for="gender">Gender</label>

                    <select id="gender">
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="section">Section</label>

                    <select id="section">
                        <option value="">Select Section</option>
                        <option value="A">A</option>
                        <option value="B">B</option>
                        <option value="C">C</option>
                        <option value="D">D</option>
                    </select>
                </div>

            </div>

            <div class="actions">

                <button type="submit" class="save" id="saveButton">
                    Add Student
                </button>

                <button
                    type="button"
                    class="cancel"
                    id="cancelButton"
                    hidden
                >
                    Cancel
                </button>

            </div>

            <p id="message"></p>

        </form>

    </div>

    <div class="card">

        <h2>Student Details</h2>

        <input
            type="search"
            id="searchInput"
            class="search"
            placeholder="Search students..."
        >

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Roll Number</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Department</th>
                        <th>Year</th>
                        <th>Gender</th>
                        <th>Section</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="studentTableBody">

                    <tr>
                        <td colspan="10" class="empty">
                            Loading students...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>
    const API_BASE_URL = '/api';

    const form = document.getElementById('studentForm');
    const tableBody = document.getElementById('studentTableBody');
    const message = document.getElementById('message');

    const searchInput = document.getElementById('searchInput');

    const studentIdInput = document.getElementById('studentId');

    const formTitle = document.getElementById('formTitle');
    const saveButton = document.getElementById('saveButton');
    const cancelButton = document.getElementById('cancelButton');

    let students = [];
    let editingId = null;

    // Check login
    async function checkLogin() {
        try {
            const response = await fetch(`${API_BASE_URL}/auth`);

            const data = await response.json();

            if (!data.loggedIn) {
                window.location.href = '/login.html';
                return false;
            }

            return true;

        } catch (error) {
            console.error('Login check error:', error);

            window.location.href = '/login.html';

            return false;
        }
    }

    // Show message
    function showMessage(text, success = false) {
        message.textContent = text;

        message.style.color = success
            ? 'green'
            : 'red';
    }

    // Get students
    async function loadStudents() {
        try {
            const response = await fetch(
                `${API_BASE_URL}/students`
            );

            if (response.status === 401) {
                window.location.href = '/login.html';
                return;
            }

            if (!response.ok) {
                throw new Error('Could not fetch students.');
            }

            students = await response.json();

            displayStudents(students);

        } catch (error) {
            console.error('Load students error:', error);

            tableBody.innerHTML = `
                <tr>
                    <td colspan="10" class="empty">
                        Could not load students.
                    </td>
                </tr>
            `;
        }
    }

    // Display students
    function displayStudents(studentList) {
        tableBody.innerHTML = '';

        if (studentList.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="10" class="empty">
                        No students found.
                    </td>
                </tr>
            `;
            return;
        }

        studentList.forEach(student => {
            const row = document.createElement('tr');

            const values = [
                student.id,
                student.name,
                student.rollnumber,
                student.email,
                student.phone || '',
                student.department || '',
                student.year || '',
                student.gender || '',
                student.section || ''
            ];

            values.forEach(value => {
                const cell = document.createElement('td');

                cell.textContent = value ?? '';

                row.appendChild(cell);
            });

            const actionCell = document.createElement('td');

            const editButton = document.createElement('button');

            editButton.textContent = 'Edit';
            editButton.className = 'edit';

            editButton.addEventListener('click', () => {
                editStudent(student.id);
            });

            const deleteButton = document.createElement('button');

            deleteButton.textContent = 'Delete';
            deleteButton.className = 'delete';

            deleteButton.addEventListener('click', () => {
                deleteStudent(student.id);
            });

            actionCell.appendChild(editButton);
            actionCell.appendChild(deleteButton);

            row.appendChild(actionCell);

            tableBody.appendChild(row);
        });
    }

    // Search students
    searchInput.addEventListener('input', () => {
        const searchText = searchInput.value
            .trim()
            .toLowerCase();

        const filteredStudents = students.filter(student => {
            return (
                String(student.name || '').toLowerCase().includes(searchText) ||
                String(student.rollnumber || '').toLowerCase().includes(searchText) ||
                String(student.email || '').toLowerCase().includes(searchText) ||
                String(student.department || '').toLowerCase().includes(searchText)
            );
        });

        displayStudents(filteredStudents);
    });

    // Add or update student
    form.addEventListener('submit', async event => {
        event.preventDefault();

        const name = document.getElementById('name').value.trim();

        const rollnumber = document.getElementById('roll_number').value.trim();

        const email = document.getElementById('email').value.trim();

        const phone = document.getElementById('phone').value.trim();

        const department = document.getElementById('department').value;

        const year = document.getElementById('year').value;

        const gender = document.getElementById('gender').value;

        const section = document.getElementById('section').value;

        if (!name || !rollnumber || !email) {
            showMessage(
                'Name, roll number and email required.'
            );
            return;
        }

        const student = {
            name: name,
            rollnumber: rollnumber,
            email: email,
            phone: phone,
            department: department,
            year: year,
            gender: gender,
            section: section
        };

        try {
            const url = editingId
                ? `${API_BASE_URL}/students/${editingId}`
                : `${API_BASE_URL}/students`;

            const method = editingId ? 'PUT' : 'POST';

            saveButton.disabled = true;

            saveButton.textContent = editingId
                ? 'Updating...'
                : 'Adding...';

            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'same-origin',
                body: JSON.stringify(student)
            });

            const data = await response.json();

            if (response.status === 401) {
                window.location.href = '/login.html';
                return;
            }

            if (!response.ok) {
                throw new Error(
                    data.message || 'Could not save student.'
                );
            }

            showMessage(data.message, true);

            resetForm();

            await loadStudents();

        } catch (error) {
            console.error('Save student error:', error);

            showMessage(error.message);

        } finally {
            saveButton.disabled = false;

            saveButton.textContent = editingId
                ? 'Update Student'
                : 'Add Student';
        }
    });

    // Edit student
    function editStudent(id) {
        const student = students.find(
            item => Number(item.id) === Number(id)
        );

        if (!student) {
            showMessage('Student not found.');
            return;
        }

        editingId = student.id;

        studentIdInput.value = student.id;

        document.getElementById('name').value =
            student.name || '';

        document.getElementById('roll_number').value =
            student.rollnumber || '';

        document.getElementById('email').value =
            student.email || '';

        document.getElementById('phone').value =
            student.phone || '';

        document.getElementById('department').value =
            student.department || '';

        document.getElementById('year').value =
            student.year || '';

        document.getElementById('gender').value =
            student.gender || '';

        document.getElementById('section').value =
            student.section || '';

        formTitle.textContent = 'Edit Student';

        saveButton.textContent = 'Update Student';

        cancelButton.hidden = false;

        showMessage('');

        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    // Delete student
    async function deleteStudent(id) {
        const confirmDelete = confirm(
            'Are you sure you want to delete this student?'
        );

        if (!confirmDelete) {
            return;
        }

        try {
            const response = await fetch(
                `${API_BASE_URL}/students/${id}`,
                {
                    method: 'DELETE',
                    credentials: 'same-origin'
                }
            );

            const data = await response.json();

            if (response.status === 401) {
                window.location.href = '/login.html';
                return;
            }

            if (!response.ok) {
                throw new Error(
                    data.message || 'Could not delete student.'
                );
            }

            showMessage(data.message, true);

            await loadStudents();

        } catch (error) {
            console.error('Delete student error:', error);

            showMessage(error.message);
        }
    }

    // Reset form
    function resetForm() {
        form.reset();

        editingId = null;

        studentIdInput.value = '';

        formTitle.textContent = 'Add Student';

        saveButton.textContent = 'Add Student';

        cancelButton.hidden = true;
    }

    // Cancel edit
    cancelButton.addEventListener('click', () => {
        resetForm();
        showMessage('');
    });

    // Logout
    document.getElementById('logoutButton')
        .addEventListener('click', async () => {
            try {
                await fetch(`${API_BASE_URL}/logout`, {
                    method: 'POST',
                    credentials: 'same-origin'
                });

            } catch (error) {
                console.error('Logout error:', error);
            }

            window.location.href = '/login.html';
        });

    // Start
    async function start() {
        const loggedIn = await checkLogin();

        if (loggedIn) {
            await loadStudents();
        }
    }

    start();
</script>

</body>
</html>
